[variables]
IS_LARAVEL = "true"

[phases.setup]
nixPkgs = ["php82", "php82Extensions.pdo_mysql", "php82Extensions.mbstring", "php82Extensions.xml", "php82Extensions.curl", "php82Extensions.zip", "php82Extensions.tokenizer", "php82Extensions.fileinfo"]
nixLibs = []
cmds = ["curl -sS https://getcomposer.org/installer | php82 -- --install-dir=/usr/local/bin --filename=composer"]

[phases.build]
cmds = [
    "composer install --no-dev --optimize-autoloader",
    "php artisan config:cache",
    "php artisan route:cache",
    "php artisan migrate --force",
    "php artisan db:seed --class=AdminSeeder --force"
]

[start]
cmd = "php -S 0.0.0.0:$PORT server.php"
